spring:
  application:
    name: urban-resilience-hub
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/resilience_hub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:app}
    password: ${RABBIT_PASSWORD:app123}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-key-must-be-at-least-32-bytes}
    ttl: 2h
  allocation:
    cache-ttl: 5m
    lock-timeout: 3s

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
